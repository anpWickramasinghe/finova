name: Finova CI Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

# Cancel in-progress runs on the same branch to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────
  # JOB 1 — Backend (Node.js / TypeScript)
  # ─────────────────────────────────────────────────────
  backend:
    name:  Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name:  Install dependencies
        run: npm ci

      - name:  TypeScript check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────
  # JOB 2 — Admin Portal (React + Vite + TypeScript)
  # ─────────────────────────────────────────────────────
  admin-portal:
    name:  Admin Portal check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-portal

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - name:  Install dependencies
        run: npm ci

      - name:  ESLint check
        run: npm run lint

      - name:  TypeScript type-check
        run: npx tsc --noEmit

      - name:  Production build
        run: npm run build

      - name:  Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-dist
          path: frontend/admin-portal/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # JOB 3 — Manager Portal (React + Vite + TypeScript)
  # ─────────────────────────────────────────────────────
  manager-portal:
    name:  Manager Portal check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/manager-portal

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/manager-portal/package-lock.json

      - name:  Install dependencies
        run: npm ci

      - name:  ESLint check
        run: npm run lint

      - name:  TypeScript type-check
        run: npx tsc --noEmit

      - name:  Production build
        run: npm run build

      - name:  Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-portal-dist
          path: frontend/manager-portal/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # JOB 4 — Employee Portal (Expo / React Native)
  # ─────────────────────────────────────────────────────
  employee-portal:
    name:  Employee Portal  Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/employee-portal

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/employee-portal/package-lock.json

      - name:  Install dependencies
        run: npm ci

      - name:  TypeScript type-check
        run: npx tsc --noEmit

      - name:  Expo Lint check
        run: npm run lint

      - name:  Expo export (Web build check)
        run: npx expo export --platform web
        env:
          EXPO_NO_DOTENV: 1
          CI: 1

  # ─────────────────────────────────────────────────────
  # JOB 5 — AI Chatbot Microservice (Python / FastAPI)
  # ─────────────────────────────────────────────────────
  # ai-chatbot:
  #   name:  AI Chatbot — Lint & Type-check
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: ai-core/chatbot

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name:  Setup Python 3.11
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.11'

  #     - name:  Install uv
  #       run: pip install uv

  #     - name:  Install dependencies
  #       run: uv sync

  #     - name:  Ruff lint
  #       run: uv run ruff check .

  #     - name:  Pyright type-check
  #       run: uv run pyright . || true   # non-blocking until stubs stabilise

  # ─────────────────────────────────────────────────────
  # JOB 6 — AI Forecasting Microservice (Python / FastAPI)
  # ─────────────────────────────────────────────────────
  # ai-forecasting:
  #   name:  AI Forecasting — Lint & Type-check
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: ai-core/forecasting

  #   steps:
  #     - name:  Checkout repository
  #       uses: actions/checkout@v4

  #     - name:  Setup Python 3.11
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.11'

  #     - name:  Install uv
  #       run: pip install uv

  #     - name:  Install dependencies
  #       run: uv sync

  #     - name:  Ruff lint
  #       run: uv run ruff check .

  #     - name:  Pyright type-check
  #       run: uv run pyright . || true   # non-blocking until stubs stabilise

  # ─────────────────────────────────────────────────────
  # JOB 7 — Docker Build Validation (all services)
  # ─────────────────────────────────────────────────────
  docker-build:
    name:  Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, admin-portal, manager-portal]

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: finova/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────
  # JOB 8 — CI Summary Gate (all jobs must pass)
  # ─────────────────────────────────────────────────────
  ci-gate:
    name: ✅ CI Gate — All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - backend
      - admin-portal
      - manager-portal
      - employee-portal
      - ai-chatbot
      - ai-forecasting
      - docker-build
    if: always()

    steps:
      - name: 🔎 Check all job results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ One or more CI jobs failed."
              exit 1
            fi
          done
          echo "✅ All CI jobs passed successfully."
