[project]
name = "finova-chatbot"
version = "0.1.0"
description = "Finova AI Chatbot microservice — financial assistant for admins using Agno + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.4.5",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pyjwt>=2.8.0",
    "google-genai>=1.73.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
