version = "0.1.0"
description = "Finova Predictive Cash Flow Forecasting microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
